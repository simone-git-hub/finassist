[project]
name = "finassist-rag-copilot"
version = "0.1.0"
description = "RAG-based finance support copilot — portfolio project for LLM/NLP engineering roles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simone Vari" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "ipython>=8.29.0",
]
eval = [
    "ragas>=0.2.0",
]

[project.scripts]
finassist-ingest = "finassist.cli.ingest:main"
finassist-build-index = "finassist.cli.build_index:main"
finassist-search = "finassist.cli.search:main"
finassist-ask = "finassist.cli.ask:main"
finassist-api = "finassist.cli.serve:main"
finassist-eval = "finassist.cli.eval:main"
finassist-demo = "finassist.cli.demo:main"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
