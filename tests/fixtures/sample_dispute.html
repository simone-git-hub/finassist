  <head><title>Dispute a transaction | Example Bank Help</title></head>
  <body>
    <main>
      <article>
        <h1>How to dispute a transaction</h1>
        <p>
          If you do not recognize a card payment, open the app, select the transaction,
          and tap Report a problem. Choose the reason, add details, and submit your dispute.
          We review disputes within 10 business days and may issue a temporary credit.
        </p>
      </article>
    </main>
  </body>
